<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Dalam Perbaikan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 560px;
            position: relative;
            z-index: 1;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .gear {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 8px solid #3b82f6;
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }

        .gear::before {
            content: '';
            position: absolute;
            inset: -16px;
            border: 8px solid transparent;
            border-top-color: #3b82f6;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
        }

        .gear.small {
            width: 45px;
            height: 45px;
            border-width: 6px;
            top: 45px;
            left: 55px;
            border-color: #8b5cf6;
            animation-direction: reverse;
            animation-duration: 3s;
        }

        .gear.small::before {
            inset: -12px;
            border-width: 6px;
            border-top-color: #8b5cf6;
            border-bottom-color: #8b5cf6;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <div class="gear"></div>
            <div class="gear small"></div>
        </div>

        <h1>Sedang Dalam Perbaikan</h1>
        
        <p>
            Website kami sedang dalam proses perbaikan dan peningkatan sistem.
            Mohon maaf atas ketidaknyamanannya. Kami akan segera kembali online.
        </p>

        <div class="badge">
            <span class="dot"></span>
            Sedang dikerjakan
        </div>

        <div class="footer">
            Terima kasih atas pengertiannya
        </div>
    </div>
</body>
</html>
